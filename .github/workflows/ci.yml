name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lanterne
          POSTGRES_PASSWORD: lanterne
          POSTGRES_DB: lanterne
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanterne -d lanterne"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://lanterne:lanterne@localhost:5432/lanterne
      TEST_DATABASE_URL: postgresql+psycopg://lanterne:lanterne@localhost:5432/lanterne
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
